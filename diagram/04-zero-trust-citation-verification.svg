<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 880" width="100%" height="auto">
    
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>
    
    <!-- Header Title -->
    <rect width="680" height="880" fill="#f8fafc" rx="16" />
    <rect x="2" y="2" width="676" height="876" fill="none" stroke="#e2e8f0" stroke-width="2" rx="14" />
    <text x="340" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0f172a">4. Zero-Trust Citation Verification Flowchart</text>
  
        <line x1="340" y1="144" x2="340" y2="178" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="none" />
      
      <g filter="url(#shadow)">
        <rect x="100" y="80" width="480" height="64" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
      </g>
      <text x="120" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#78350f">1. 🧠 LLM Returns Candidate Quote</text>
      <text x="120" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569">Candidate: 'thirty-day (30-day) written notice of termination'</text>
    
        <line x1="340" y1="242" x2="340" y2="276" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="none" />
      
      <g filter="url(#shadow)">
        <rect x="100" y="178" width="480" height="64" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
      </g>
      <text x="120" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a">2. 🛡️ Zero-Trust Verifier Intercepts Quote</text>
      <text x="120" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569">Application code takes control; never trusts AI page guesses</text>
    
        <line x1="340" y1="340" x2="340" y2="374" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="none" />
      
      <g filter="url(#shadow)">
        <rect x="100" y="276" width="480" height="64" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      </g>
      <text x="120" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a">3. 🔍 Exact & Normalized Character Search</text>
      <text x="120" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569">Searches raw contract text; handles smart quotes and line breaks</text>
    
        <line x1="340" y1="438" x2="340" y2="472" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="none" />
      
      <g filter="url(#shadow)">
        <rect x="100" y="374" width="480" height="64" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      </g>
      <text x="120" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a">4. 🎯 Repeated Quote Disambiguation</text>
      <text x="120" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569">If quote appears multiple times, matches the chunk the AI analyzed</text>
    
        <line x1="340" y1="536" x2="340" y2="570" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="none" />
      
      <g filter="url(#shadow)">
        <rect x="100" y="472" width="480" height="64" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
      </g>
      <text x="120" y="498" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#064e3b">5. 📍 Deterministic Offset Found</text>
      <text x="120" y="518" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569">Resolves exact character index: [3,892 to 3,925] in document</text>
    
        <line x1="340" y1="634" x2="340" y2="668" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="none" />
      
      <g filter="url(#shadow)">
        <rect x="100" y="570" width="480" height="64" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" />
      </g>
      <text x="120" y="596" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#064e3b">6. 📄 True Page & Coordinate Resolution</text>
      <text x="120" y="616" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569">Maps offset to Page 4 and extracts visual bounding box (x, y, w, h)</text>
    
        <line x1="340" y1="732" x2="340" y2="766" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="none" />
      
      <g filter="url(#shadow)">
        <rect x="100" y="668" width="480" height="64" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" />
      </g>
      <text x="120" y="694" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#312e81">7. 💳 Clickable Badge Rendered in UI</text>
      <text x="120" y="714" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569">Displays 'Verified Clause • Page 4' card under the answer</text>
    
      <g filter="url(#shadow)">
        <rect x="100" y="766" width="480" height="64" rx="12" fill="#fef9c3" stroke="#eab308" stroke-width="1.5" />
      </g>
      <text x="120" y="792" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#713f12">8. 🟡 Canvas Highlight & Scoped Jump</text>
      <text x="120" y="812" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569">Viewer jumps to Page 4 and pulses glowing yellow box on exact words</text>
    
  </svg>